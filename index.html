<script>
(function(){
  var SUPA="https://ffdvnbitndnbqqshidnt.supabase.co", ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmZHZuYml0bmRuYnFxc2hpZG50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTg3MjIsImV4cCI6MjEwMjg3NDcyMn0.KJDuhYcCevM5k3FUmeCuDOTtVKsfPVDwNI28iwP28RY", SALT="bridge-relay-v1", ITERS=100000, _key=null;
  function b64e(buf){var b=new Uint8Array(buf),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
  function b64d(str){var s=atob(str),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
  async function deriveKey(pass){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    return await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode(SALT),iterations:ITERS,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  async function enc(obj){
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var data=new TextEncoder().encode(JSON.stringify(obj));
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},_key,data);
    var out=new Uint8Array(12+ct.byteLength); out.set(iv,0); out.set(new Uint8Array(ct),12);
    return b64e(out.buffer);
  }
  async function dec(b64){
    var raw=b64d(b64), iv=raw.slice(0,12), ct=raw.slice(12);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},_key,ct);
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function sreq(method,path,body,prefer){
    var h={'apikey':ANON,'Authorization':'Bearer '+ANON,'Content-Type':'application/json'};
    if(prefer)h['Prefer']=prefer;
    return fetch(SUPA+'/rest/v1/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.text().then(function(t){return t?JSON.parse(t):null;});});
  }
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
  var _busy=0;
  function _spin(on){
    var el=document.getElementById('__relaySpin');
    if(!el){
      el=document.createElement('div'); el.id='__relaySpin';
      el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:150000;background:#1f3e54;color:#fff;text-align:center;padding:8px;font-family:sans-serif;font-size:13px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.25)';
      el.innerHTML='<span style="display:inline-block;width:13px;height:13px;border:2px solid #9db8cb;border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:8px;animation:__sp 0.8s linear infinite"></span>処理中…';
      if(!document.getElementById('__spStyle')){ var st=document.createElement('style'); st.id='__spStyle'; st.textContent='@keyframes __sp{to{transform:rotate(360deg)}}'; document.head.appendChild(st); }
      document.body.appendChild(el);
    }
    el.style.display=on?'block':'none';
  }
  async function callApi(name,args){
    _busy++; _spin(true);
    try{
      var req=await enc({name:name,args:args});
      var ins=await sreq('POST','jobs',{req:req},'return=representation');
      var id=ins&&ins[0]&&ins[0].id;
      if(!id) return {ok:false,msg:'リレー投入に失敗しました'};
      for(var i=0;i<80;i++){   // 最大~40秒
        await sleep(500);
        var rows=await sreq('GET','jobs?id=eq.'+id+'&select=res,done');
        if(rows&&rows[0]&&rows[0].done){
          try{ sreq('DELETE','jobs?id=eq.'+id); }catch(e){}
          if(!rows[0].res) return {ok:false,msg:'空の結果'};
          try{ return await dec(rows[0].res); }
          catch(e){
            localStorage.removeItem('relay_pass');
            alert('合言葉が正しくないようです。もう一度入力してください。');
            location.reload();
            return {ok:false,msg:'合言葉エラー'};
          }
        }
      }
      return {ok:false,msg:'応答待ちタイムアウト（PC側の中継ワーカーが起動しているか確認してください）'};
    } finally { _busy--; if(_busy<=0) _spin(false); }
  }
  // 前回調書 損傷一覧を画面内オーバーレイ(iframe=checklist.html)で開く
  function showChk(){
    var ov=document.getElementById('__chkOverlay');
    if(!ov){
      ov=document.createElement('div'); ov.id='__chkOverlay';
      ov.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.35);display:flex;flex-direction:column';
      var bar=document.createElement('div');
      bar.style.cssText='background:#1f3e54;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700';
      var t=document.createElement('span'); t.textContent='前回調書 損傷一覧';
      var c=document.createElement('button'); c.textContent='閉じる';
      c.style.cssText='background:#fff;color:#1f3e54;border:none;border-radius:5px;padding:5px 14px;cursor:pointer;font-weight:700';
      c.onclick=function(){ ov.style.display='none'; };
      bar.appendChild(t); bar.appendChild(c);
      var f=document.createElement('iframe'); f.id='__chkFrame';
      f.style.cssText='flex:1;width:100%;border:none;background:#fff';
      ov.appendChild(bar); ov.appendChild(f); document.body.appendChild(ov);
    }
    ov.style.display='flex';
    document.getElementById('__chkFrame').src='./checklist.html?ts='+Date.now();
  }
  window.__showChecklist=showChk;
  window.pywebview={api:new Proxy({},{get:function(_,n){return function(){
    var a=Array.prototype.slice.call(arguments);
    // ライセンス機能はWeb版では使わない(内部版扱い)。中継せず即OKを返しゲートを出さない。
    if(n==='license_status'||n==='license_set_key'){ return Promise.resolve({external:false, ok:true}); }
    return callApi(n,a).then(function(res){
      if((n==='prev_set_bridge'||n==='prev_set_bridge_for') && res && res.ok && !res.multiple){ try{ showChk(); }catch(e){} }
      return res;
    });
  };}})};
  function askPass(msg){
    return new Promise(function(resolve){
      var ov=document.createElement('div');
      ov.style.cssText='position:fixed;inset:0;z-index:200000;background:rgba(238,242,246,.98);display:flex;align-items:center;justify-content:center;font-family:sans-serif';
      ov.innerHTML='<div style="background:#fff;border:1px solid #ccc;border-radius:12px;padding:22px;max-width:400px;width:90%">'
        +'<h3 style="margin:0 0 10px;font-size:16px">合言葉</h3>'
        +'<div style="font-size:13px;color:#555;margin-bottom:12px">'+(msg||'PC側ワーカーと同じ合言葉を入力してください。')+'</div>'
        +'<input id="__pp" type="text" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" inputmode="text" '
        +'style="width:100%;box-sizing:border-box;padding:11px;font-size:16px;border:1px solid #ccc;border-radius:8px">'
        +'<button id="__ppb" style="margin-top:12px;width:100%;padding:12px;background:#2d5673;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:15px">認証</button></div>';
      document.body.appendChild(ov);
      var inp=ov.querySelector('#__pp'), btn=ov.querySelector('#__ppb');
      setTimeout(function(){ inp.focus(); }, 50);
      function go(){ var v=(inp.value||'').trim(); if(!v) return; document.body.removeChild(ov); resolve(v); }
      btn.onclick=go; inp.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
    });
  }
  async function boot(){
    var pass=localStorage.getItem('relay_pass');
    if(!pass){ pass=await askPass(); localStorage.setItem('relay_pass',pass); }
    try{ _key=await deriveKey(pass); }catch(e){ localStorage.removeItem('relay_pass'); location.reload(); return; }
    window.dispatchEvent(new Event('pywebviewready'));
  }
  window.addEventListener('DOMContentLoaded', boot);
})();
</script>

  .err{background:#fdecea;border:1px solid #f3c4bd;color:#a8341f;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;white-space:pre-wrap}
  #lightbox{position:fixed;inset:0;background:rgba(15,25,35,.88);display:none;align-items:center;justify-content:center;z-index:100;cursor:zoom-out}
  #lightbox img{max-width:92vw;max-height:92vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5);cursor:default}
  #lbclose{position:fixed;top:18px;right:24px;z-index:101;background:#fff;color:var(--ink);
    border:none;border-radius:6px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;
    box-shadow:0 2px 12px rgba(0,0,0,.45);font-family:inherit}
  #lbclose:hover{background:#f0f4f7}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #9db8cb;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}
  @keyframes r{to{transform:rotate(360deg)}}
  .warmbadge{display:inline-block;font-size:11.5px;padding:4px 12px;border-radius:12px;font-weight:700;margin-top:6px}
  .warmbadge.warm-loading{background:#fff3e0;color:#b5651d;border:1px solid #e8c39e}
  .warmbadge.warm-ready{background:#e8f6ec;color:#1f7a3a;border:1px solid #b8e0c4}
  .warmbadge.warm-hidden{display:none}
  /* ライセンス認可ゲート(社外版) */
  .licgate{position:fixed;inset:0;background:rgba(238,242,246,0.98);z-index:99999;display:flex;align-items:center;justify-content:center}
  .licbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 30px;max-width:460px;width:90%;box-shadow:0 12px 44px rgba(0,0,0,0.14)}
  .licbox h3{margin:0 0 12px;font-size:16px}
  .licmsg{font-size:13px;color:var(--ink);margin-bottom:14px;line-height:1.75;min-height:1.6em}
  .lickey{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;letter-spacing:0.5px}
  .licbtns{display:flex;gap:8px;margin-top:14px}
  .licnote{font-size:11.5px;color:var(--ink-soft);margin-top:14px}
  #licbadge{display:none;font-size:11px;padding:3px 10px;border-radius:11px;background:#eef4f8;color:#3a6b8a;border:1px solid #cfe0ea;margin-left:8px}
  /* ===== スマホ向けレイアウト(≤700px)。PC版は不変 ===== */
  @media (max-width:700px){
    header{padding:10px 12px;gap:8px}
    header h1{font-size:16px;letter-spacing:0;line-height:1.3}
    header .brand{height:22px}
    .bar{padding:10px 12px;gap:8px}
    main{padding:12px}
    .manual{padding:14px 12px}
    .mgrid{grid-template-columns:1fr;gap:10px}
    .fld.wide,.fld.span2{grid-column:auto}
    .fld select,.fld input,.fld textarea{font-size:16px;padding:10px 10px}  /* 16px=iOSの自動ズーム防止 */
    .manual .actions{flex-direction:column}
    .manual .actions .btn{width:100%;padding:12px}
    .obs .row{grid-template-columns:1fr;gap:2px}
    .obs .row .k{font-weight:700;color:var(--steel-d)}
    .pbox{padding:14px;width:96%;max-height:90vh}
    .grades{gap:8px}
    .gradefld{flex:1 1 44%}
    .gradefld select{width:100%}
    .genqa .gentext{font-size:16px}
    .hit-top{gap:6px}
    .matchset{margin-left:0}
  }
</style>
</head>
<body>

<script>
const $ = s => document.querySelector(s);
let manualImages = [];
let manualKeys = [];   // manualImagesと平行。前回調書写真は事前計算ベクトルのキー、手貼りはnull
let optionsLoaded = false;
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function showErr(m){$('#err').innerHTML = m? `<div class="err">${esc(m)}</div>`:'';}
function lb(src){$('#lbimg').src=src;$('#lightbox').style.display='flex';}

window.addEventListener('pywebviewready', async ()=>{
  // 社外版はライセンス認可を通ってから本体起動。社内版はゲートを素通り。
  const ok = await checkLicenseGate();
  if(ok){ await bootApp(); }
  startLicenseWatch();   // 定期再確認(失効/キルスイッチ反映)
});
async function bootApp(){
  if(window._booted) return; window._booted=true;
  try{
    const r = await window.pywebview.api.startup();
    if(r && r.ok && r.bundled){
      onTeacherLoaded({path:'(同梱データ)', count:r.count, photo_dir:r.photo_dir});
      await loadOptions();
      // 直前にセットしていた橋梁を継続表示(再起動後の作業継続)
      try{ const lb=await window.pywebview.api.prev_last_bridge(); if(lb && lb.has && lb.bridge_name){ const el=$('#f_橋梁名'); if(el) el.value=lb.bridge_name; } }catch(e){}
    } else if(r && !r.ok){ showErr(r.msg||'初期化に失敗しました'); }
  }catch(e){}
  startWarmWatch();   // 検索エンジン(モデル)のウォームアップ状態を監視
}

// ===== ライセンス認可ゲート(社外版のみ) =====
async function checkLicenseGate(){
  let s;
  try{ s = await window.pywebview.api.license_status(); }catch(e){ return true; }
  if(!s || s.external===false){ hideGate(); return true; }   // 社内版=素通り
  if(s.ok){ hideGate(); showLicBadge(s); return true; }
  showGate(s);
  return false;
}
function licReasonMsg(s){
  const exp = s.expires_at ? ('（期限: '+String(s.expires_at).slice(0,10)+'）') : '';
  const m = {
    no_key:'ライセンスキーを入力して「認証」を押してください。',
    invalid_key:'ライセンスキーが正しくありません。再度ご確認ください。',
    expired:'ライセンスの期限が切れています。'+exp+'管理者にご連絡ください。',
    disabled:'このライセンスは現在停止されています。管理者にご連絡ください。',
    seat_limit:'登録できる台数の上限に達しています。管理者にご連絡ください。',
    device_revoked:'この端末は利用が無効化されています。管理者にご連絡ください。',
    network:'認証サーバーに接続できません。インターネット接続をご確認のうえ再試行してください。'
  };
  return esc(m[s.reason] || ('認証できませんでした（'+(s.reason||'不明')+'）。'));
}
function showGate(s){
  const g=$('#licenseGate'); if(!g) return;
  g.style.display='flex';
  $('#licMsg').innerHTML = licReasonMsg(s||{});
}
function hideGate(){ const g=$('#licenseGate'); if(g) g.style.display='none'; }
function showLicBadge(s){
  const b=$('#licbadge'); if(!b) return;
  if(s && s.expires_at){ b.textContent='ライセンス有効（期限 '+String(s.expires_at).slice(0,10)+'）'; b.style.display='inline-block'; }
}
async function licSubmit(){
  const k=($('#licKey').value||'').trim(); if(!k){ $('#licMsg').textContent='キーを入力してください。'; return; }
  $('#licMsg').textContent='確認中...';
  let s; try{ s=await window.pywebview.api.license_set_key(k); }catch(e){ s={external:true,ok:false,reason:'network'}; }
  if(s.ok){ hideGate(); showLicBadge(s); await bootApp(); } else { showGate(s); }
}
async function licRetry(){
  $('#licMsg').textContent='確認中...';
  let s; try{ s=await window.pywebview.api.license_status(); }catch(e){ s={external:true,ok:false,reason:'network'}; }
  if(s.external===false || s.ok){ hideGate(); if(s.ok) showLicBadge(s); await bootApp(); } else { showGate(s); }
}
function startLicenseWatch(){
  setInterval(async ()=>{
    let s; try{ s=await window.pywebview.api.license_status(); }catch(e){ return; }
    if(s && s.external && !s.ok){ showGate(s); }   // 動作中に失効/停止したらロック

// 送信前に写真を縮小(長辺MAX・JPEG)。スマホのカメラ写真でも中継が軽く・速くなる。
// 画像類似モデルは内部でさらに小さくリサイズするため精度への影響はほぼ無い。
const PHOTO_MAX_EDGE=1024, PHOTO_QUALITY=0.82;
function pushManualPhoto(dataURL){
  const img=new Image();
  img.onload=()=>{
    const m=Math.max(img.width,img.height); let out=dataURL;
    if(m>PHOTO_MAX_EDGE){
      const s=PHOTO_MAX_EDGE/m, cw=Math.round(img.width*s), ch=Math.round(img.height*s);
      const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
      cv.getContext('2d').drawImage(img,0,0,cw,ch);
      try{ out=cv.toDataURL('image/jpeg',PHOTO_QUALITY); }catch(e){ out=dataURL; }
    }
    manualImages.push(out); manualKeys.push(null); renderManualPhotos();
  };
  img.onerror=()=>{ manualImages.push(dataURL); manualKeys.push(null); renderManualPhotos(); };
  img.src=dataURL;
}
function addImageFiles(files){
  [...files].forEach(file=>{
    if(file.type && !file.type.startsWith('image/')) return;
    const rd=new FileReader(); rd.onload=()=>{ pushManualPhoto(rd.result); }; rd.readAsDataURL(file);
  });
}
$('#filepick').addEventListener('change', e=>{ addImageFiles(e.target.files); e.target.value=''; });
(function(){

  ['dragleave','dragend'].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); dz.classList.remove('dragover'); }));
  dz.addEventListener('drop', e=>{ e.preventDefault(); e.stopPropagation(); dz.classList.remove('dragover'); if(e.dataTransfer&&e.dataTransfer.files) addImageFiles(e.dataTransfer.files); });
  ['dragover','drop'].forEach(ev=>window.addEventListener(ev, e=>{ e.preventDefault(); }));
})();

// ヒットの所見は原文(◇見出し・改行・「・」箇条書きを保持)を省略なく表示し、続けて評価を出す。
// 原文はPDF由来の途中改行(◇/・/【で始まらない行)を直前行へ連結して整形する。
function fullText(h){
  const seg=(lab,v)=> v? `<div class="seg"><span class="lab">${lab}</span>${esc(v)}</div>`:'';
  const grade=(lab,g,v)=> (g||v)? `<div class="seg"><span class="lab">${lab}${g?'：'+esc(g):''}</span>${esc(v||'')}</div>`:'';
  if(h['原文']){
    // 原文(◇見出し・「・」箇条書き)の途中改行(◇/・/【で始まらない行)を直前行へ連結
    const lines=[];
    String(h['原文']).split('\n').forEach(l=>{
      if(!lines.length || /^\s*[◇◆・･【]/.test(l)) lines.push(l); else lines[lines.length-1]+=l;
    });
    // 評価・措置を【】付きで続ける(原文の形式のままコピペできるように)
    const taika=h['耐荷性能評価'];
    if(taika || h['評価内容']){ lines.push('【耐荷性能の評価'+(taika?'：'+taika:'')+'】'); if(h['評価内容']) lines.push(h['評価内容']); }
    if(h['耐久性能評価']){ lines.push('【耐久性能の評価】'); lines.push(h['耐久性能評価']); }
    const sochi=h['措置の必要性'];
    if(sochi || h['措置の内容']){ lines.push('【措置の必要性'+(sochi?'：'+sochi:'')+'】'); if(h['措置の内容']) lines.push(h['措置の内容']); }
    const genbun = lines.map(l=>esc(l)).join('\n');   // 実改行(pre-wrap)でコピペ整合
    return `<div class="fulltext"><div class="genbun">${genbun}</div></div>`;
  }
  // 原文が無い場合(手動入力等)は分割表示にフォールバック
  const evals = grade('耐荷性能の評価',h['耐荷性能評価'],h['評価内容'])
              + seg('耐久性能の評価',h['耐久性能評価'])
              + grade('措置の必要性',h['措置の必要性'],h['措置の内容']);
  const body = seg('状態',h['状態'])+seg('原因',h['原因'])+seg('進行性',h['進行性'])+evals;
  return body? `<div class="fulltext">${body}</div>`:'';
}

function render(cases){
  const root = $('#results');
  if(!cases.length){ root.innerHTML='<div class="empty">所見が抽出できませんでした。</div>'; return; }
  root.innerHTML = cases.map(co => {
    const c = co.case;
    const photos = (c.images||[]).map(s=>`<figure><img src="${s}" onclick="lb('${s}')">${c['キャプション']?`<figcaption>${esc(c['キャプション'])}</figcaption>`:''}</figure>`).join('');
    const tags = [
      c['構成要素'] && `<span class="tag">構成要素：${esc(c['構成要素'])}</span>`,
      c['部材'] && `<span class="tag">部材：${esc(c['部材'])}</span>`,
      c['損傷種類'] && `<span class="tag">損傷：${esc(c['損傷種類'])}</span>`,
      c['耐荷性能評価'] && `<span class="tag">耐荷：${esc(c['耐荷性能評価'])}</span>`,
      c['措置の必要性'] && `<span class="tag">措置：${esc(c['措置の必要性'])}</span>`
    ].filter(Boolean).join('');
    const hits = (co.hits||[]).map(h=>{
      const hp = (h.images||[]).slice(0,4).map(s=>`<img src="${s}" onclick="lb('${s}')">`).join('');
      const ms = (h.matched||[]).map(m=>`<span class="m">${esc(m)}</span>`).join('');
      const htags=[
        h['様式番号']&&`<span class="htag">${esc(h['様式番号'])}</span>`,
        h['構成要素']&&`<span class="htag">構成:${esc(h['構成要素'])}</span>`,
        h['部材']&&`<span class="htag">部材:${esc(h['部材'])}</span>`,
        h['損傷種類']&&`<span class="htag">損傷:${esc(h['損傷種類'])}</span>`,
        h['構造形式']&&`<span class="htag">${esc(h['構造形式'])}</span>`,
        h['診断員']&&`<span class="htag">診断員:${esc(h['診断員'])}</span>`,
        (h.sim_state!=null)&&`<span class="htag">状態類似 ${h.sim_state}</span>`,
        (h.img_sim!=null)&&`<span class="htag" style="background:#e3edf4;color:#2d5673;font-weight:600">写真類似 ${h.img_sim}</span>`
      ].filter(Boolean).join('');
      return `<div class="hit">
        <div class="hit-top">
          <span class="name">${esc(h['ファイル名'])}・${esc(h['見出し'])||''}</span>
          <span class="score">類似度 <b>${h.score}</b></span>
          <span class="matchset">${ms}</span>
        </div>
        <div class="htags">${htags}</div>
        ${fullText(h)}
        ${hp?`<div class="hit-photos">${hp}</div>`:''}
      </div>`;
    }).join('') || '<div class="noadvice">類似する過去所見は見つかりませんでした。</div>';
    return `<div class="case">
      <div class="case-head">
        <div class="n">${esc(c['所見番号'])}</div>
        ${c['様式番号']?`<div class="form">${esc(c['様式番号'])}</div>`:''}
        <div class="ttl">${esc(c['見出し'])||'(見出しなし)'}</div>
        <div class="meta">${esc(c['出張所'])||''}<br>${esc(c['構造形式'])||''}</div>
      </div>
      <div class="case-body">
        ${fullText(c)}
        <div class="tags">${tags}</div>
        ${photos?`<div class="photos">${photos}</div>`:''}
        <div class="hits-head">類似する過去所見 <span class="cnt">${(co.hits||[]).length}</span></div>
        ${hits}
      </div>
    </div>`;
  }).join('');
}

// ===== 所見例の生成(QA→編集可能ドラフト) =====
function closeGen(){ $('#genModal').classList.remove('show'); }
function genInput(){
  // 主検索(check_manual)と同じメタ項目を渡し、生成ボタンの検索結果を主検索と一致させる
  return {構成要素:$('#f_構成要素').value, 部材:$('#f_部材').value, 損傷種類:$('#f_損傷種類').value,
    構造形式:$('#f_構造形式').value, 管轄出張所:$('#f_管轄出張所').value,
    橋梁診断員名称:$('#f_橋梁診断員名称').value,
    耐荷性能評価:$('#f_耐荷性能評価').value, 措置の必要性:$('#f_措置の必要性').value,
    状態:$('#f_損傷の状態').value, 原因:$('#f_損傷の原因').value, 進行性:(window._r3prog||''),
    images:manualImages, prev_vec_keys:manualKeys};   // 写真ありなら画像類似も使って検索→生成
}
async function openGen(){
  // 押すたびに、その時点の入力値で必ず再検索して生成する
  window._genInput=genInput();
  $('#status').innerHTML='<span class="spin"></span> 類似所見を検索して所見例を生成中...';
  const r=await window.pywebview.api.generate_shoken(window._genInput);
  $('#status').textContent='';
  if(!r.ok){ showErr(r.msg||'生成失敗'); return; }
  window._gen=r;
  window._genStruct={部材:window._genInput.部材||'', 損傷種類:window._genInput.損傷種類||''};
  renderGen(r);
  $('#genModal').classList.add('show');
}
const CAND_LABEL={状態:'損傷の状態',原因:'損傷の原因',進行性:'損傷の進行性',
  耐荷評価:'耐荷性能の評価',耐久評価:'耐久性能の評価',措置内容:'措置の内容'};
function candRadios(field){
  const cs=(window._gen.candidates&&window._gen.candidates[field])||[];
  const name='cand_'+field;
  const opts=cs.map((c,i)=>`<label class="candopt"><input type="radio" name="${name}" value="${i}" ${i===0?'checked':''} onchange="onCandPick('${field}',${i})"><span class="cs">${esc(c.source)}</span>${esc(c.text)}</label>`).join('');
  const cur=cs.length?cs[0].text:'';
  const rows=(field==='進行性')?2:3;
  return `<div class="genfield"><div class="genlab">${CAND_LABEL[field]||field}</div>${opts}
    <textarea id="gen_${field}" class="gentext" rows="${rows}">${esc(cur)}</textarea></div>`;
}
function onCandPick(field,i){
  const cs=window._gen.candidates[field]||[];
  if(cs[i]) $('#gen_'+field).value=cs[i].text;
}
const GRADE_OPTS={耐荷:['Ａ','Ｂ','Ｃ','対象外'],耐久:['有','無'],第三者:['有','無'],
  措置:['無','有','有（Ｍ）','有（Ｓ２）','有（Ｓ１）'],健全性:['Ⅰ相当','Ⅱ相当','Ⅲ相当']};
function gradeSelect(k){
  const g=window._gen.grades||{}; const cur=g[k]||'';
  const opts=(GRADE_OPTS[k]||[]).map(v=>`<option ${v===cur?'selected':''}>${v}</option>`).join('');
  return `<div class="gradefld"><label>${k}</label><select id="grade_${k}">${opts}</select></div>`;
}
function renderGen(r){
  const combo=r.template?r.template.combo:'(該当なし)';
  const exact=r.grades_exact?'':' <span style="color:#b5862a">※近いテンプレを使用</span>';
  const inp=window._genInput||{};
  // 部材・損傷種類は本体入力のプルダウン選択肢を流用(耐荷の左に置く)
  const buzaiSel=`<div class="gradefld"><label>部材</label><select id="gen_部材">${$('#f_部材').innerHTML}</select></div>`;
  const sonshoSel=`<div class="gradefld"><label>損傷種類</label><select id="gen_損傷種類">${$('#f_損傷種類').innerHTML}</select></div>`;
  $('#genBody').innerHTML=`
    <h4>所見例の生成</h4>
    <div class="genfield"><div class="genlab">部材・損傷種類・性能評価・区分（推定値　修正可）</div>
      <div class="grades">${buzaiSel}${sonshoSel}${['耐荷','耐久','第三者','措置','健全性'].map(gradeSelect).join('')}</div>
      <div class="combo">照合テンプレ：<b id="genCombo">${esc(combo)}</b>${exact}</div>
    </div>
    <div class="genlab">所見ドラフト（自由に編集できます）</div>
    <textarea id="genDraft" class="gendraft" rows="16">${esc(r.draft||'')}</textarea>
    <div style="display:flex;gap:8px;margin:10px 0 16px">
      <button class="btn accent" onclick="updateDraft()">ドラフトを更新</button>
      <button class="btn accent" onclick="copyDraft()">クリップボードにコピー</button>
      <button class="btn ghost" onclick="closeGen()">閉じる</button>
    </div>
    <div class="genqa">
      ${candRadios('状態')}
      ${candRadios('原因')}
      ${candRadios('進行性')}
      ${candRadios('耐荷評価')}
      ${candRadios('耐久評価')}
      ${candRadios('措置内容')}
    </div>`;
  // 部材・損傷種類プルダウンに現在の入力値を反映
  const b=$('#gen_部材'), s=$('#gen_損傷種類');
  if(b) b.value=inp.部材||''; if(s) s.value=inp.損傷種類||'';
}
async function updateDraft(){
  const curBuzai=$('#gen_部材').value, curSonsho=$('#gen_損傷種類').value;
  const prev=window._genStruct||{};
  // 部材/損傷種類を変えた場合は、検索項目で指定したときと同じ“まっさらな再生成”にする
  // (前回生成の推定グレードや候補を持ち越さない)。
  const structChanged=(curBuzai!==(prev.部材||''))||(curSonsho!==(prev.損傷種類||''));
  const GK=['耐荷','耐久','第三者','措置','健全性'];
  const grades={}; GK.forEach(k=>grades[k]=$('#grade_'+k).value);
  const prevGrades=(window._gen&&window._gen.grades)||{};
  // グレードを修正した場合は、修正後の値で類似所見を再検索し、評価本文も再導出する
  // (前回グレードの評価文をtextareaから持ち越さない=B修正時にA文が残る不具合対策)。
  const gradeChanged=GK.some(k=>grades[k]!==(prevGrades[k]||''));
  const input=Object.assign({},(window._genInput||genInput()),{部材:curBuzai, 損傷種類:curSonsho});
  window._genInput=input;
  let payload, fullRender=false;
  if(structChanged){
    payload=input;                       // selectionを付けない = openGen(検索項目指定)と同一
    fullRender=true;
  }else if(gradeChanged){
    // 修正後グレードで再検索し、状態/原因/進行性・評価本文とも候補を作り直す
    // (入力値/R3があれば候補先頭に来るので保持される)。評価本文はグレード整合の類似所見から。
    payload=Object.assign({},input,{selection:{grades:grades}});
    fullRender=true;
  }else{
    const selection={状態:$('#gen_状態').value, 原因:$('#gen_原因').value, 進行性:$('#gen_進行性').value,
      耐荷評価:$('#gen_耐荷評価').value, 耐久評価:$('#gen_耐久評価').value, 措置内容:$('#gen_措置内容').value, grades:grades};
    payload=Object.assign({},input,{selection:selection});
  }
  $('#status').innerHTML='<span class="spin"></span> 再検索して更新中...';
  const r=await window.pywebview.api.generate_shoken(payload);
  $('#status').textContent='';
  if(!r.ok){ showErr(r.msg||'更新失敗'); return; }
  window._gen=r;
  window._genStruct={部材:curBuzai, 損傷種類:curSonsho};
  if(fullRender){
    renderGen(r);                        // グレード・候補・評価本文欄も作り直す
  }else{
    $('#genDraft').value=r.draft||'';
    $('#genCombo').textContent=r.template?r.template.combo:'(該当なし)';
  }
}
function copyDraft(){
  const t=$('#genDraft').value;
  navigator.clipboard.writeText(t).then(()=>{ $('#status').textContent='ドラフトをコピーしました。'; },
    ()=>{ $('#genDraft').select(); document.execCommand('copy'); $('#status').textContent='コピーしました。'; });
}
</script>
