<!DOCTYPE html>
<html lang="ja">
<head>
<script>
(function(){
  var SUPA="https://ffdvnbitndnbqqshidnt.supabase.co", ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmZHZuYml0bmRuYnFxc2hpZG50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTg3MjIsImV4cCI6MjEwMjg3NDcyMn0.KJDuhYcCevM5k3FUmeCuDOTtVKsfPVDwNI28iwP28RY", SALT="bridge-relay-v1", ITERS=100000, _key=null;
  function b64e(buf){var b=new Uint8Array(buf),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
  function b64d(str){var s=atob(str),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
  async function deriveKey(pass){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    return await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode(SALT),iterations:ITERS,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  async function enc(obj){
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var data=new TextEncoder().encode(JSON.stringify(obj));
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},_key,data);
    var out=new Uint8Array(12+ct.byteLength); out.set(iv,0); out.set(new Uint8Array(ct),12);
    return b64e(out.buffer);
  }
  async function dec(b64){
    var raw=b64d(b64), iv=raw.slice(0,12), ct=raw.slice(12);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},_key,ct);
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function sreq(method,path,body,prefer){
    var h={'apikey':ANON,'Authorization':'Bearer '+ANON,'Content-Type':'application/json'};
    if(prefer)h['Prefer']=prefer;
    return fetch(SUPA+'/rest/v1/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.text().then(function(t){return t?JSON.parse(t):null;});});
  }
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
  var _busy=0;
  function _spin(on){
    var el=document.getElementById('__relaySpin');
    if(!el){
      el=document.createElement('div'); el.id='__relaySpin';
      el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:150000;background:#1f3e54;color:#fff;text-align:center;padding:8px;font-family:sans-serif;font-size:13px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.25)';
      el.innerHTML='<span style="display:inline-block;width:13px;height:13px;border:2px solid #9db8cb;border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:8px;animation:__sp 0.8s linear infinite"></span>処理中…';
      if(!document.getElementById('__spStyle')){ var st=document.createElement('style'); st.id='__spStyle'; st.textContent='@keyframes __sp{to{transform:rotate(360deg)}}'; document.head.appendChild(st); }
      document.body.appendChild(el);
    }
    el.style.display=on?'block':'none';
  }
  async function callApi(name,args){
    _busy++; _spin(true);
    try{
      var req=await enc({name:name,args:args});
      var ins=await sreq('POST','jobs',{req:req},'return=representation');
      var id=ins&&ins[0]&&ins[0].id;
      if(!id) return {ok:false,msg:'リレー投入に失敗しました'};
      for(var i=0;i<80;i++){   // 最大~40秒
        await sleep(500);
        var rows=await sreq('GET','jobs?id=eq.'+id+'&select=res,done');
        if(rows&&rows[0]&&rows[0].done){
          try{ sreq('DELETE','jobs?id=eq.'+id); }catch(e){}
          if(!rows[0].res) return {ok:false,msg:'空の結果'};
          try{ return await dec(rows[0].res); }
          catch(e){
            localStorage.removeItem('relay_pass');
            alert('合言葉が正しくないようです。もう一度入力してください。');
            location.reload();
            return {ok:false,msg:'合言葉エラー'};
          }
        }
      }
      return {ok:false,msg:'応答待ちタイムアウト（PC側の中継ワーカーが起動しているか確認してください）'};
    } finally { _busy--; if(_busy<=0) _spin(false); }
  }
  // 前回調書 損傷一覧を画面内オーバーレイ(iframe=checklist.html)で開く
  function showChk(){
    var ov=document.getElementById('__chkOverlay');
    if(!ov){
      ov=document.createElement('div'); ov.id='__chkOverlay';
      ov.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.35);display:flex;flex-direction:column';
      var bar=document.createElement('div');
      bar.style.cssText='background:#1f3e54;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700';
      var t=document.createElement('span'); t.textContent='前回調書 損傷一覧';
      var c=document.createElement('button'); c.textContent='閉じる';
      c.style.cssText='background:#fff;color:#1f3e54;border:none;border-radius:5px;padding:5px 14px;cursor:pointer;font-weight:700';
      c.onclick=function(){ ov.style.display='none'; };
      bar.appendChild(t); bar.appendChild(c);
      var f=document.createElement('iframe'); f.id='__chkFrame';
      f.style.cssText='flex:1;width:100%;border:none;background:#fff';
      ov.appendChild(bar); ov.appendChild(f); document.body.appendChild(ov);
    }
    ov.style.display='flex';
    document.getElementById('__chkFrame').src='./checklist.html?ts='+Date.now();
  }
  window.__showChecklist=showChk;
  window.pywebview={api:new Proxy({},{get:function(_,n){return function(){
    var a=Array.prototype.slice.call(arguments);
    // ライセンス機能はWeb版では使わない(内部版扱い)。中継せず即OKを返しゲートを出さない。
    if(n==='license_status'||n==='license_set_key'){ return Promise.resolve({external:false, ok:true}); }
    return callApi(n,a).then(function(res){
      if((n==='prev_set_bridge'||n==='prev_set_bridge_for') && res && res.ok && !res.multiple){ try{ showChk(); }catch(e){} }
      return res;
    });
  };}})};
  function askPass(msg){
    return new Promise(function(resolve){
      var ov=document.createElement('div');
      ov.style.cssText='position:fixed;inset:0;z-index:200000;background:rgba(238,242,246,.98);display:flex;align-items:center;justify-content:center;font-family:sans-serif';
      ov.innerHTML='<div style="background:#fff;border:1px solid #ccc;border-radius:12px;padding:22px;max-width:400px;width:90%">'
        +'<h3 style="margin:0 0 10px;font-size:16px">合言葉</h3>'
        +'<div style="font-size:13px;color:#555;margin-bottom:12px">'+(msg||'PC側ワーカーと同じ合言葉を入力してください。')+'</div>'
        +'<input id="__pp" type="text" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" inputmode="text" '
        +'style="width:100%;box-sizing:border-box;padding:11px;font-size:16px;border:1px solid #ccc;border-radius:8px">'
        +'<button id="__ppb" style="margin-top:12px;width:100%;padding:12px;background:#2d5673;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:15px">認証</button></div>';
      document.body.appendChild(ov);
      var inp=ov.querySelector('#__pp'), btn=ov.querySelector('#__ppb');
      setTimeout(function(){ inp.focus(); }, 50);
      function go(){ var v=(inp.value||'').trim(); if(!v) return; document.body.removeChild(ov); resolve(v); }
      btn.onclick=go; inp.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
    });
  }
  async function boot(){
    var pass=localStorage.getItem('relay_pass');
    if(!pass){ pass=await askPass(); localStorage.setItem('relay_pass',pass); }
    try{ _key=await deriveKey(pass); }catch(e){ localStorage.removeItem('relay_pass'); location.reload(); return; }
    window.dispatchEvent(new Event('pywebviewready'));
  }
  window.addEventListener('DOMContentLoaded', boot);
})();
</script>

<meta charset="UTF-8">
<title>対策区分B以外の損傷一覧</title>
<style>
  :root{--ink:#1a2530;--ink-soft:#54616e;--line:#d6dde4;--line-soft:#e8edf1;--bg:#f4f6f8;
    --steel:#2d5673;--steel-d:#1f3e54;--accent:#c0532b}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);background:var(--bg);font-size:13px}
  header{background:var(--steel-d);color:#fff;padding:10px 16px;font-weight:700;font-size:14px;position:sticky;top:0;z-index:5}
  header .sub{font-weight:400;font-size:11px;color:#9db8cb;margin-left:8px}
  .filters{display:flex;gap:7px;flex-wrap:wrap;padding:9px 16px;background:#fff;border-bottom:1px solid var(--line);align-items:center;position:sticky;top:38px;z-index:5}
  .filters input,.filters select{border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:12px;font-family:inherit;background:#fcfdfe}
  .filters input{width:100px}
  .filters .lbl{font-size:11px;color:var(--ink-soft)}
  .filters .bchk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink);
    background:#fff7f2;border:1px solid #e5c3b3;border-radius:5px;padding:4px 9px;cursor:pointer}
  .filters .bchk input{width:16px;height:16px;cursor:pointer;margin:0}
  .wrap{padding:12px 16px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  th{background:#f2f6f9;color:var(--steel-d);font-weight:700;position:sticky;top:74px;z-index:4}
  td.c{text-align:center;white-space:nowrap}
  input[type=checkbox]{width:18px;height:18px;cursor:pointer}
  .sh{color:var(--ink-soft);max-width:420px}
  tr:hover td{background:#f7fafc}
  .kubun{background:var(--accent);color:#fff;border-radius:4px;padding:1px 7px;font-size:10.5px;font-weight:700}
  .btn{border:1px solid var(--steel);background:var(--steel);color:#fff;padding:4px 10px;border-radius:5px;
    font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--steel-d)}
  .btn.ghost{background:#fff;color:var(--steel)}
  .empty{text-align:center;color:#999;padding:24px}
  /* スマホ向け(≤700px): 横スクロール＋文字縮小 */
  @media (max-width:700px){
    header{font-size:13px;padding:8px 12px}
    .filters{padding:8px 10px;gap:5px}
    .filters input{width:84px}
    .filters input,.filters select{font-size:14px}
    .wrap{padding:8px;overflow-x:auto}
    table{font-size:11px;min-width:640px}
    th,td{padding:4px 6px}
    th{top:0}
    .sh{max-width:220px}
    .btn{padding:6px 10px}
  }
</style>
</head>
<body>
<header>前回調書 損傷一覧<span class="sub" id="subttl"></span></header>
<div class="filters">
  <span class="lbl">絞込</span>
  <select id="f_k" onchange="render()"><option value="">径間：すべて</option></select>
  <select id="f_m" onchange="render()"><option value="">部材名：すべて</option></select>
  <select id="f_n" onchange="render()"><option value="">部材番号：すべて</option></select>
  <select id="f_d" onchange="render()" style="max-width:210px"><option value="">損傷の種類：すべて</option></select>
  <select id="f_g" onchange="render()" style="max-width:230px"><option value="">部材群：すべて</option></select>
  <select id="f_c" onchange="render()"><option value="">チェック:すべて</option><option value="on">✓のみ</option><option value="off">未のみ</option></select>
  <label class="bchk"><input type="checkbox" id="f_b" onchange="render()"> 対策区分Bを表示</label>
  <button class="btn ghost" onclick="clearF()">条件クリア</button>
  <button class="btn ghost" id="gbtn" onclick="pickGroupFolder()">部材群フォルダ選択</button>
  <span class="lbl" id="gstat"></span>
</div>
<div class="wrap"><div id="tbl"><div class="empty">読み込み中…</div></div></div>

<script>
const $=s=>document.querySelector(s);
let DATA={records:[],checks:{},bridge_key:'',path:''};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function rowId(r){return [r['径間'],r['部材'],r['部材番号'],r['損傷種類'],(r['状態']||'').slice(0,16)].join('|');}
async function loadData(){
  DATA=await window.pywebview.api.chk_get();
  DATA.checks=DATA.checks||{};
  $('#subttl').textContent=`${DATA.bridge_key||''}（${(DATA.records||[]).length}件）`;
  const uniq=(k)=>[...new Set((DATA.records||[]).map(x=>String(x[k]||'')).filter(Boolean))];
  // select の現在値を保持しつつ、先頭「すべて」＋全候補を再構築（選択後も全項目から選び直せる）
  const fill=(id,k,label)=>{ const el=$('#'+id),cur=el.value;
    el.innerHTML=`<option value="">${label}：すべて</option>`+uniq(k).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
    el.value=cur; };
  fill('f_k','径間','径間'); fill('f_m','部材','部材名'); fill('f_n','部材番号','部材番号'); fill('f_d','損傷種類','損傷の種類');
  // 部材群(橋梁ごとにフォルダ選択で構築)。候補は group_names から。
  const gs=DATA.group_names||[]; const gel=$('#f_g'), gcur=gel.value;
  gel.innerHTML=`<option value="">部材群：すべて</option>`+gs.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  gel.value=gcur; gel.disabled=gs.length===0;
  if(gs.length) $('#gstat').textContent=`部材群 ${gs.length}件 読込済`;
  else if(!$('#gstat').textContent.includes('OCR')) $('#gstat').textContent='部材群フォルダ未選択';
  render();
}
function clearF(){ ['f_k','f_m','f_n','f_d','f_g'].forEach(i=>$('#'+i).value=''); $('#f_c').value=''; $('#f_b').checked=false; render(); }
function render(){
  const g=id=>($('#'+id).value||'').trim();
  const f={k:g('f_k'),m:g('f_m'),n:g('f_n'),d:g('f_d'),g:g('f_g'),c:$('#f_c').value};
  const showB=$('#f_b').checked;
  const rows=(DATA.records||[]).map((r,i)=>({r,i})).filter(({r})=>{
    if(!showB && String(r['対策区分']||'')==='B')return false;   // 既定はB非表示
    if(f.k&&!String(r['径間']||'').includes(f.k))return false;
    if(f.m&&!String(r['部材']||'').includes(f.m))return false;
    if(f.n&&!String(r['部材番号']||'').includes(f.n))return false;
    if(f.d&&!String(r['損傷種類']||'').includes(f.d))return false;
    if(f.g&&!((r['部材群']||[]).includes(f.g)))return false;
    const on=!!DATA.checks[rowId(r)];
    if(f.c==='on'&&!on)return false;
    if(f.c==='off'&&on)return false;
    return true;
  });
  const body=rows.map(({r,i})=>{
    const on=DATA.checks[rowId(r)]?'checked':'';
    return `<tr>
      <td class="c"><input type="checkbox" ${on} onchange="toggle(${i},this)"></td>
      <td class="c"><button class="btn" onclick="transcribe(${i})">転記</button></td>
      <td class="c">${esc(r['径間'])}</td><td>${esc(r['部材'])}</td>
      <td class="c">${esc(r['部材番号'])||''}</td>
      <td><span class="kubun">${esc(r['対策区分'])}</span> ${esc(r['損傷種類'])}</td>
      <td class="sh">${esc((r['状態']||r['全文']||'').slice(0,70))}…</td></tr>`;
  }).join('');
  $('#tbl').innerHTML=`<table><thead><tr><th>✓</th><th>転記</th><th>径間</th><th>部材名</th><th>部材番号</th><th>損傷の種類</th><th>所見（一部）</th></tr></thead>
    <tbody>${body||'<tr><td colspan="7" class="empty">該当なし</td></tr>'}</tbody></table>`;
  const tot=(DATA.records||[]).length;
  $('#subttl').textContent=`${DATA.bridge_key||''}（表示 ${rows.length} / 全 ${tot} 件）`;
}
async function toggle(i,el){
  const r=DATA.records[i]; const id=rowId(r);
  if(el.checked) DATA.checks[id]=true; else delete DATA.checks[id];
  await window.pywebview.api.prev_save_check(DATA.bridge_key, id, el.checked);
  if($('#f_c').value) render();
}
function transcribe(i){
  // Web版: 親(iframe)またはopener(別窓)の転記関数を直接呼ぶ。デスクトップ版: Python経由。
  var host=(window.parent&&window.parent!==window)?window.parent:(window.opener||null);
  if(host&&host.transcribeFromChecklist){ host.transcribeFromChecklist(DATA.records[i], DATA.path); try{host.focus&&host.focus();}catch(e){} }
  else { window.pywebview.api.chk_transcribe(i); }
}
function setGroupStatus(msg){ $('#gstat').textContent=msg; }   // OCR進捗(Python→JS)
async function pickGroupFolder(){
  const btn=$('#gbtn'); btn.disabled=true;
  $('#gstat').textContent='フォルダを選択してください…';
  try{
    const r=await window.pywebview.api.prev_pick_group_folder();
    if(!r){ $('#gstat').textContent=''; }
    else if(r.cancelled){ $('#gstat').textContent='（選択をキャンセルしました）'; }
    else if(!r.ok){ $('#gstat').textContent='失敗: '+(r.msg||'').split('\n')[0]; }
    // 成功時は Python 側が loadData() を呼び直して群一覧を反映する
  }catch(e){ $('#gstat').textContent='エラー: '+e; }
  finally{ btn.disabled=false; }
}
window.addEventListener('pywebviewready', loadData);
</script>
</body>
</html>
